name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.90.0
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/biturbo/models
          key: biturbo-models-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            biturbo-models-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libopenblas-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck frontend
        run: pnpm typecheck

      - name: Lint frontend
        run: pnpm lint

      - name: Test frontend
        run: pnpm test

      - name: Typecheck scripts
        run: pnpm typecheck:scripts

      - name: Build frontend
        run: pnpm build

      - name: Create sidecar placeholder
        run: |
          mkdir -p src-tauri/binaries
          echo placeholder > src-tauri/binaries/biturbo-mcp-x86_64-unknown-linux-gnu

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets -- --test-threads=1
        env:
  # (#563) Cache embedding models and force CPU EP; single thread to avoid ONNX runtime contention.
          BITURBO_EMBED_EP: cpu

  mcp-smoke:
    name: MCP smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Cache embedding models
        uses: actions/cache@v4
        with:
          path: ~/.cache/biturbo/models
          key: biturbo-models-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.toml') }}
          restore-keys: |
            biturbo-models-${{ runner.os }}-

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            libopenblas-dev \
            librsvg2-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Create sidecar placeholder
        run: |
          mkdir -p src-tauri/binaries
          echo placeholder > src-tauri/binaries/biturbo-mcp-x86_64-unknown-linux-gnu

      - run: pnpm mcp:build
      - run: pnpm mcp:test
        env:
          BITURBO_EMBED_EP: cpu

  docs:
    name: Generated docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify generated tool docs are up to date
        run: |
          python3 scripts/generate_tool_docs.py
          git diff --exit-code docs/tools-table.md
